<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pago completado — ReclamaYa</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    .exito-main {
      padding-top: 64px;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f8f9fb;
    }
    .exito-card {
      background: #fff;
      border: 1px solid #e8e8e8;
      border-radius: 12px;
      padding: 3rem 2.5rem;
      max-width: 480px;
      width: 100%;
      text-align: center;
      margin: 1.5rem;
    }
    .exito-icono {
      width: 64px;
      height: 64px;
      background: #f6faf8;
      border: 2px solid #2d6a4f;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 28px;
      margin: 0 auto 1.5rem;
    }
    .exito-titulo {
      font-size: 1.4rem;
      font-weight: 700;
      color: #1a1a2e;
      margin-bottom: 0.75rem;
    }
    .exito-texto {
      font-size: 14px;
      color: #555;
      line-height: 1.7;
      margin-bottom: 1.5rem;
    }
    .exito-aviso {
      background: #f6faf8;
      border: 1px solid #c3ddd0;
      border-radius: 8px;
      padding: 1rem;
      font-size: 13px;
      color: #2d6a4f;
      margin-bottom: 1.5rem;
      line-height: 1.6;
    }
  </style>
</head>
<body>

  <nav id="navbar">
    <div class="nav-inner">
      <a href="/" class="nav-logo">
        <div class="nav-logo-icon">⚡</div>
        <span>ReclamaYa</span>
      </a>
    </div>
  </nav>

  <main class="exito-main">
    <div class="exito-card">
      <div class="exito-icono">✓</div>
      <h1 class="exito-titulo">Pago completado</h1>
      <p class="exito-texto">Tu escrito de reclamación está siendo generado. En unos minutos lo recibirás en tu email en formato PDF, listo para enviar.</p>
      <div class="exito-aviso">
        📧 Revisa tu bandeja de entrada. Si no lo ves en 5 minutos, comprueba la carpeta de spam.
      </div>
      <a href="/reclamar.html" class="btn-primary" style="display:inline-block;">Hacer otra reclamación</a>
    </div>
  </main>

  <script>
    window.addEventListener('scroll', () => {
      const navbar = document.getElementById('navbar');
      if (window.scrollY > 50) navbar.classList.add('scrolled');
      else navbar.classList.remove('scrolled');
    });
  </script>

</body>
</html>
